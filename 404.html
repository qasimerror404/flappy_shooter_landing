<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>404 · Flappy Shooter</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#2A6A98">
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="/assets/icon.png">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Inter:wght@400;700;800&display=swap">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: linear-gradient(180deg, #2A6A98 0%, #3FA8CE 55%, #8FD4ED 100%);
    font-family: 'Inter', system-ui, sans-serif;
    color: #fff;
    -webkit-font-smoothing: antialiased;
  }
  main {
    min-height: 100%;
    display: grid;
    place-items: center;
    padding: 32px 24px;
    text-align: center;
  }
  .logo {
    width: 84px;
    height: 84px;
    border-radius: 22px;
    box-shadow: 0 12px 30px rgba(0,0,0,.35);
    margin: 0 auto 22px;
  }
  h1 {
    font-family: 'Bungee', sans-serif;
    font-size: clamp(56px, 18vw, 120px);
    letter-spacing: .06em;
    text-shadow: 0 6px 0 #6E5826;
    color: #FFE066;
    line-height: 1;
  }
  p {
    margin-top: 14px;
    max-width: 420px;
    color: rgba(255,255,255,.9);
    font-size: 16px;
  }
  a.home {
    display: inline-block;
    margin-top: 28px;
    padding: 14px 26px;
    background: linear-gradient(180deg, #FFE066 0%, #FFB347 100%);
    color: #1B1B1F;
    font-family: 'Bungee', sans-serif;
    letter-spacing: .12em;
    border-radius: 14px;
    text-decoration: none;
    box-shadow: 0 8px 20px rgba(255,179,71,.35);
    transition: transform .15s ease;
  }
  a.home:hover, a.home:focus-visible { transform: translateY(-2px); outline: 3px solid rgba(255,255,255,.4); outline-offset: 2px; }
</style>
</head>
<body>
<main>
  <div>
    <img class="logo" src="/assets/icon.png" alt="" aria-hidden="true">
    <h1>404</h1>
    <p>That pipe led nowhere. The page you were looking for doesn't exist — or got shot down.</p>
    <a class="home" href="/">FLY HOME</a>
  </div>
</main>
</body>
</html>
